<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Cost Estimator: Matching test</title>

  <!-- EXACT SAME CSS, now external -->
  <link rel="stylesheet" href="/home/css/styles.css?v=1" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Medi-cal Coverage</h1>
    </div>

    <div class="panel">
      <div class="row">
        <input id="query" type="text" placeholder='Example: "MRI brain with contrast"' />
        <select id="topk">
          <option value="2">Top-k: 2</option>
          <option value="5" selected>Top-k: 5</option>
        </select>
        <button id="btn">Search</button>
      </div>

      <div class="error" id="errorBox"></div>
      <div class="footerHint">Press Enter to search</div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script type="module" src="/home/js/app.js?v=1"></script>
</body>
</html>
