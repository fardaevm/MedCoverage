version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      QUESTIONS_CACHE_TTL_SECONDS: "604800"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      DISABLE_STATIC_CACHE: "1"
    volumes:
      - ./backend/frontend:/app/backend/frontend:rw
    command: ["python","-m","uvicorn","src.main:app","--app-dir","src","--host","0.0.0.0","--port","8000","--reload","--reload-dir","/app/backend"]