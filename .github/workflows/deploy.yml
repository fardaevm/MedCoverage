name: Deploy to AWS EC2
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af

      - name: Build, tag, push
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest -f Dockerfile.prod .
          docker push ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest

      - name: Deploy via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medcoverage-api" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "Deploying to $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 715841330713.dkr.ecr.us-west-2.amazonaws.com",
              "docker pull 715841330713.dkr.ecr.us-west-2.amazonaws.com/medcoverage-api:latest",
              "docker stop medcoverage || true",
              "docker rm medcoverage || true",
              "docker run -d --name medcoverage --restart always -p 8000:8000 --env-file /etc/medcoverage.env 715841330713.dkr.ecr.us-west-2.amazonaws.com/medcoverage-api:latest"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Get output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text